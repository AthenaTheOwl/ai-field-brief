  - id: MTRX-W37-SESSION-ATTACH-APPROVAL
    matrix_run_id: MTRX-W37-the-harness-is-the-artifact
    source_item_id: src-w37-ant-sessions-connect
    lens_id: runtime-adapter
    mode: extractive
    content: "The ant CLI added `ant beta:sessions connect`, which attaches a terminal to an existing Managed Agents session — loading its transcript, following it live, and sending messages, interrupts and tool-call decisions back. Esc sends user.interrupt; approval choices are Yes, No, and 'No, and tell the agent why', delivered as a user.tool_confirmation event carrying any typed reason as deny_message. Passing --web serves the Console session viewer from 127.0.0.1 and opens it in the browser, with credentials staying in the local ant process. Released 2026-09-10."
    source_refs:
      - uri: "https://platform.claude.com/docs/en/cli-sdks-libraries/cli/sessions-connect"
        quote_or_span: "ant beta:sessions connect; Esc sends user.interrupt; approval sent as a user.tool_confirmation event with any typed reason as deny_message"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The approval prompt is not universal — the docs scope it to an always_ask policy, or auto when the server reaches no determination. The brief carries that scope."
      - "Without --web the command requires an interactive terminal; scripts must use ant beta:sessions:events stream / send."
      - "In multiagent sessions the terminal view follows only the primary thread; only the browser viewer follows every thread."
      - "The --web URL is single-use within two minutes and the local server dies on Ctrl+C."
      - "The command is beta (beta: namespace)."

