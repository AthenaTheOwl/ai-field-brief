  - id: MTRX-W37-ACCEPTANCE-BAR-ARCHITECTURE
    matrix_run_id: MTRX-W37-the-harness-is-the-artifact
    source_item_id: src-w37-shopify-back-to-native
    lens_id: governance
    mode: extractive
    content: "Shopify is moving mobile development from React Native back to native Swift and Kotlin, six years after committing to React Native in 2020, naming agent capability as the assumption that changed — agents now do enough of the implementation, translation, testing and review work that maintaining two codebases is no longer the deciding cost — alongside closer platform access and fewer dependency layers. The migration is a greenfield rebuild: the Shop app was rebuilt in 12 weeks and has shipped. Three maintained libraries are affected with three different outcomes: react-native-skia forked and republished by William Candillon with Shopify sponsoring through end of 2026; FlashList stewardship still under discussion; Restyle being archived. Separately, on 2026-09-11 Anthropic's Boris Cherny posted that 'production code written by Claude should have a higher bar than if it was written by a human', naming lint rules, tests, Claude-driven end-to-end tests, Claude-powered fuzzers running daily, automated code reviews and security reviews, and automated refactoring, 'and so on'."
    source_refs:
      - uri: "https://shopify.engineering/back-to-native"
        quote_or_span: "byline Mustafa Ali, 2026-09-10; the Shop app rebuilt 'in just 12 weeks' and shipped"
        ref_type: quote
      - uri: "https://simonwillison.net/2026/Sep/11/boris-cherny/"
        quote_or_span: "Production code written by Claude should have a higher bar than if it was written by a human."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The three-library framing must not be flattened to 'transitioning to new maintainers': FlashList has no successor yet and Restyle is being archived outright; only Skia has a named new home."
      - "Agent capability is the decisive changed assumption but not the only stated reason; platform-capability access and fewer dependency layers are also cited."
      - "Single vendor's first-party engineering post about its own decision with zero quantitative evidence — no measured productivity delta, no agent-authored-code share. Not generalizable to an industry claim that cross-platform runtimes are uneconomic."
      - "The Cherny guardrail list is explicitly non-exhaustive, closing with 'and so on'; the brief says 'naming', not 'enumerating'."
      - "Cherny's statement is a norm plus a self-report with no definition of the higher bar, no coverage or defect data, and no external audit. The tweet could not be opened directly (x.com returns 402 to unauthenticated fetches); verification rests on Simon Willison's verbatim transcription and cite link."
      - "Only the end-to-end tests and fuzzers are labelled Claude-driven/Claude-powered; the reviews and refactoring are not specified as model-driven."

  - id: MTRX-W37-UNMERGED-OUTPUT
