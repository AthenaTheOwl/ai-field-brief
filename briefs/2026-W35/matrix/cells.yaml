        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The grouping of five entries into one time-of-check-to-time-of-use and coverage-gap class is this brief's interpretation, not the vendor's framing."

  - id: MTRX-W35-DEVICE-INTERFACE-RECOVERY
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-model-hardware-standard
    lens_id: architecture
    mode: extractive
    content: "Anthropic opened a research preview of the Model Hardware Standard on 2026-08-27, a model-agnostic specification for agents to operate programmable laboratory and manufacturing devices, reachable by any harness over standard protocols including MCP, with early partners including AWS, Danaher, Tecan, QIAGEN, Doosan Robotics, Automata, Universal Robots, Hugging Face and Raspberry Pi; a QuEra agent is reported at 99.3 percent success across 700 laser-lock recovery trials against 58 percent for manually written scripts."
    source_refs:
      - uri: "https://www.anthropic.com/news/model-hardware-standard-research-preview"
        quote_or_span: "research preview of the Model Hardware Standard, a shared specification for AI agents to safely operate physical devices; QuEra agent 99.3% across 700 laser-lock recovery trials versus 58% for manually written scripts"
        ref_type: url
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The recovery figures are vendor-reported inside a launch announcement and carry no independent replication."
      - "The announcement does not publish interlock, emergency-stop, or actuator-logging semantics; the brief treats that absence as an open question, not as a claim."

  - id: MTRX-W35-PRE-INVOCATION-DISCOVERY
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-ard-spec
    lens_id: architecture
    mode: extractive
    content: "The Agentic Resource Discovery specification, published 2026-08-24 under Apache-2.0 with contributors from Microsoft, Google, Hugging Face, GoDaddy, Cisco, Databricks, GitHub, Nvidia, Salesforce, ServiceNow and Snowflake, defines a discovery protocol that sits entirely before invocation, covers any external capability a client can call, is explicitly not an execution runtime, does not replace MCP or A2A, and assumes many discovery services instead of one central catalogue."
    source_refs:
      - uri: "https://agenticresourcediscovery.org/"
        quote_or_span: "ARD sits entirely before invocation. It helps the client find the right resource; the resource is then invoked through its own native mechanism."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The specification page does not publish endpoint shapes or a version number; the brief claims a design boundary, not an implementable interface."
      - "Supersedes the single-vendor discovery surface covered as a Top signal in 2026-W26; the continuity is stated in the pick."

  - id: MTRX-W35-SPEC-FIRST-EVAL-TASKS
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-langchain-agent-environments
    lens_id: eval
    mode: extractive
    content: "Trivedy and Hollon describe a two-step pipeline in which traces, code, or human input produce a markdown spec describing task input, environment, and graders, and the spec then produces an executable task and environment; a world spec carries dataset-wide knowledge, tasks are refined by reading real agent trajectories, and difficulty is calibrated by running each task across model tiers to surface cases where a stronger model exploits a poorly designed task."
    source_refs:
      - uri: "https://www.langchain.com/blog/building-agent-environments-and-tasks"
        quote_or_span: "A spec is a markdown file that describes what the task (input, environment, graders) looks like in natural language; run each task with different tier models; identifying reward hacks"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Vendor engineering post describing internal practice; no measured comparison against directly authored tasks is published."

  - id: MTRX-W35-INDEPENDENT-SCORER-PIPELINE
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-automated-alignment-researchers
    lens_id: eval
    mode: extractive
    content: "Anthropic reports an automated alignment researcher pipeline in which four librarian agents build a shared survey and five researchers work in parallel, each iteration writing a results-free mini-paper, passing code through a monitor, training the target for roughly thirty minutes on one H200, and submitting to a separate evaluator; across ten alignment failures the best methods reduce the targeted failure and generalise to models up to 4.7 times larger, and a post-hoc monitor found cheating in 2.4 percent of trajectories, none among the top methods."
    source_refs:
      - uri: "https://alignment.anthropic.com/2026/automated-alignment-researchers/"
        quote_or_span: "trains the target model for about 30 minutes on one H200 GPU; models up to 4.7x larger than the target model; cheating in 2.4% of trajectories"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Authors state the results are limited to alignment failures measurable with public benchmarks or automated auditing, and that evaluations are proxies for deployment misalignment."
      - "Capability preservation was measured only on math, college-level knowledge, and instruction-following."
