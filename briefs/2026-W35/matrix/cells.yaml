  - id: MTRX-W35-CONTEXT-FILE-NULL-RESULT
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-agents-md-eval
    lens_id: context
    mode: extractive
    content: "Gloaguen, Mundler, Muller, Raychev and Vechev evaluated coding agents with repository-level context files on benchmark tasks and on issues from repositories carrying developer-committed files, and report that context files do not generally improve task success rates while increasing inference cost by over 20 percent on average; instructions were followed, repository overviews were not helpful, and the result held across models, agents, and both generated and human-written files."
    source_refs:
      - uri: "https://arxiv.org/abs/2602.11988"
        quote_or_span: "providing context files does not generally improve task success rates, while increasing inference cost by over 20% on average"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Submitted 2026-02-12, revised 2026-06-23; predates the issue window and is admitted as previously uncovered carryover."

  - id: MTRX-W35-DISCLOSURE-ONE-LEVEL
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-progressive-disclosure
    lens_id: context
    mode: extractive
    content: "He, Zhao, Wang and Chen report that one level of progressive disclosure is enough, that a deeper routing level provides no benefit and sometimes breaks accuracy outright, and that the gain from the pattern is harness-dependent: large where the agent navigates a raw document poorly, near zero where a strong harness already divides and retrieves on its own."
    source_refs:
      - uri: "https://arxiv.org/abs/2607.17598"
        quote_or_span: "progressive disclosure buys context, not intelligence; near zero when a strong agent harness already divides and retrieves on its own"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Submitted 2026-07-20; predates the issue window and is admitted as previously uncovered carryover."

  - id: MTRX-W35-SEMANTIC-COMPACTION
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-selfcompact
    lens_id: context
    mode: extractive
    content: "SelfCompact pairs a model-invocable compaction tool with a fire-or-suppress rubric and reports improvement over a no-summarisation baseline of up to 18.1 points on math and 5 to 9 points on agentic search at 30 to 70 percent lower per-question cost across six benchmarks and seven models, with the authors stating that neither the tool nor the rubric works alone."
    source_refs:
      - uri: "https://arxiv.org/abs/2606.23525"
        quote_or_span: "improving over a no-summarization baseline by up to 18.1 points on math and 5-9 points on agentic search at 30-70% lower per-question cost"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Submitted 2026-06-22, revised 2026-07-10; carryover admitted through the in-window weekly digest."
      - "Benchmark gains are bound to the published setup and the seven models evaluated."

  - id: MTRX-W35-PERMISSION-BOUNDARY-COVERAGE
    matrix_run_id: MTRX-W35-contracts-outside-the-prompt
    source_item_id: src-w35-claude-code-2-1-251
    lens_id: security
    mode: interpretive
    content: "Claude Code 2.1.251, published 2026-08-28, fixed five defects that share one shape: file tools following a symlink swapped inside the working directory after the permission check; Grep and Glob not applying Read deny rules through a symlinked search path; plugin marketplace commands able to point outside the plugin directory; the Workflow tool reading a scriptPath before the permission check ran; and project settings able to turn on raw API body logging or bypass a managed-settings tracing endpoint."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
        quote_or_span: "Fixed file tools (Read, Write, Edit) following a symlink swapped inside the working directory after the permission check"
        ref_type: quote
