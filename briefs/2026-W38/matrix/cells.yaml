  - id: MTRX-W38-GATEWAY-HINT-HEADERS
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-claude-code-2-1-273
    lens_id: observability
    mode: extractive
    content: "Claude Code 2.1.273, published 2026-09-15, adds five opt-in request headers for LLM gateways — request class, agent type, previous tool durations, compaction, and context-compacted — enabled with CLAUDE_CODE_GATEWAY_HINT_HEADERS=1, so a gateway can attribute each request to the kind of turn that produced it."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.273"
        quote_or_span: "Added `x-claude-code-request-class`, `x-claude-code-agent-type`, `x-claude-code-prev-tool-durations`, `x-claude-code-compaction` and `x-claude-code-context-compacted` request headers for LLM gateways; opt in with `CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.273"
        quote_or_span: "release published_at 2026-09-15T20:23:03Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The source lists the header names only; the value vocabularies for request class and agent type are not documented in the release note."
      - "Headers reach a gateway you operate; a direct connection to the API gains nothing from the flag."
