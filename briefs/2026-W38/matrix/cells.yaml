  - id: MTRX-W38-AGENTGUARD-TRACES
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-agentguard
    lens_id: eval
    mode: extractive
    content: "AgentGuard (arXiv 2609.16287, submitted 2026-09-14) mines recurring execution failure patterns from 642 documented failure traces across 382 repository tasks, generalizes them into instruction-level behavioural constraints, and packages them as a guardrail skill that activates only the rules relevant to the current instruction. Reported effect: Abnormal Execution Rate from 69.0% to 26.7%, Successful Task Completion Rate from 21.7% to 35.0%."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.16287"
        quote_or_span: "AgentGuard automatically extracts recurring execution failure patterns, generalizes them into instruction-level behavioral constraints, and organizes them as a lightweight guardrail skill that dynamically activates only the rules relevant to the current instruction."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.16287"
        quote_or_span: "We evaluate AgentGuard using 642 documented failure traces collected from real coding-agent executions across 382 repository tasks."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.16287"
        quote_or_span: "AgentGuard reduces the Abnormal Execution Rate from 69.0% to 26.7% and increases the Successful Task Completion Rate from 21.7% to 35.0%."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Abstract-level figures only; the split between the traces used to mine rules and the tasks used to evaluate them is stated as 461 traces over 282 tasks for mining and 100 tasks held out, and the two rates are defined by the authors."
      - "Two authors, affiliations not shown on the abstract page; no independent replication in the window."
  - id: MTRX-W38-XCONF-ABSTENTION
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-xconf
    lens_id: workflow
    mode: extractive
    content: "XConf (arXiv 2609.17708, submitted 2026-09-15) estimates confidence from a record of the model's own graded past episodes. It beats or matches ten-sample self-consistency on discrimination in 23 of 24 comparisons with lower calibration error at a tenth of the generation cost, and abstaining on the 10% least-confident episodes raises delivered success by up to 8.7 points on agent tasks."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.17708"
        quote_or_span: "XConf beats or matches ten-sample self-consistency in discrimination (AUROC) on 23 of 24 comparisons, with much lower calibration error (ECE), at a tenth of the generation cost"
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.17708"
        quote_or_span: "abstaining on the 10% least-confident episodes raises the delivered success rate by up to 8.7 points on agent tasks"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "'Up to 8.7 points' is a maximum across the agent tasks reported, not a typical gain; the abstract reports nine benchmarks and four models from three families without naming which pair produced the maximum."
      - "The record of graded past episodes is a store the operator must build and maintain; the abstract does not say how much history is needed before the estimate is useful."
  - id: MTRX-W38-AGORA-GIT-MEMORY
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-agora
    lens_id: workflow
    mode: extractive
    content: "Agora (arXiv 2609.18094, submitted 2026-09-16) records collective research as an append-only DAG stored in Git. In a run of nearly 12 days, 13 language-model workers published 1,703 contributions on a weight-transfer problem and drove the evaluator from 3.39 to 1.899 bits per byte, closing 62% of the gap to a trained GPT-2 124M; the abstract also reports a 145-commit ancestry, 15 accounts and 165 independent reproductions."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.18094"
        quote_or_span: "research is recorded as an append-only directed acyclic graph (DAG) stored in Git"
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.18094"
        quote_or_span: "They published 1,703 contributions and drove the evaluator from 3.39 to 1.899 bits per byte, closing 62% of the gap to a trained GPT-2 124M"
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.18094"
        quote_or_span: "a run of nearly 12 days in which 13 language-model workers"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The evaluator is a fixed bits-per-byte metric on a fixed target; the 62% figure is progress toward a model that already exists, which is the design, not a discovery claim."
      - "Contribution and reproduction counts are the authors' own logs; the abstract does not report compute or dollar cost for the 12-day run."
  - id: MTRX-W38-DREAM-RSI-REPLAY
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-dream-rsi
    lens_id: eval
    mode: extractive
    content: "Dream-RSI (arXiv 2609.14858, submitted 2026-09-14) builds a replay simulator from historical discovery trees and refines exploration policies against it, getting off-policy feedback without repeating expensive online evaluations; the authors report competitive or improved discovery quality with substantially reduced discovery cost in several settings across algorithm engineering, mathematical optimization and GPU kernel engineering."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.14858"
        quote_or_span: "Our key insight is that accumulated discovery history can serve as a replay simulator over the realized search space."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.14858"
        quote_or_span: "secures immediate, low-cost off-policy feedback to evaluate and refine exploration policies without invoking repetitive, expensive online evaluations."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.14858"
        quote_or_span: "achieves competitive or improved discovery quality while substantially reducing discovery cost in several settings."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "'Competitive or improved' and 'in several settings' are the abstract's own hedges; no single headline number is stated at abstract level."
      - "A replay simulator built from past discovery trees can only score policies within the region those trees covered."
  - id: MTRX-W38-RSIAGENT-VERIFIER
