  - id: MTRX-W38-EGRESS-BOUNDARY-FLAG
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-claude-code-2-1-277
    lens_id: security
    mode: extractive
    content: "The same release adds CLAUDE_GATEWAY_PROXY_IS_EGRESS_BOUNDARY=1 for Claude apps gateways whose only egress is a forward proxy; with it set, every outbound request hands the proxy the hostname instead of resolving it locally, so name resolution and destination policy move to the proxy."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.277"
        quote_or_span: "Added `CLAUDE_GATEWAY_PROXY_IS_EGRESS_BOUNDARY=1` for Claude apps gateways whose only egress is a forward proxy: every outbound request hands the proxy the hostname instead of resolving it locally"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The flag applies to Claude apps gateway deployments; the source does not say it changes behaviour for a default local install without a gateway."
      - "The source describes what the client does (hands the proxy the hostname); whether the proxy enforces anything is the operator's configuration, not a client guarantee."
  - id: MTRX-W38-FETCH-TOOL-ADVISORIES
    matrix_run_id: MTRX-W38-the-ruler-outside-the-loop
    source_item_id: src-w38-pydantic-ai-2-44-0
    lens_id: security
    mode: extractive
    content: "pydantic-ai 2.44.0, published 2026-09-17, fixes four security issues, all reached through web_fetch_tool or OpenTelemetry instrumentation: an IPv6 zone-identifier bypass of the cloud-metadata and private-IP blocklists on URLs opted into local access; superlinear response processing on the event loop that let one attacker-chosen page stall every agent in the process; domain lists compared as written rather than in resolver form; and spans that carried exceptions, instructions and the output template despite include_content=False. Backported to 1.107.6."
    source_refs:
      - uri: "https://github.com/pydantic/pydantic-ai/releases/tag/v2.44.0"
        quote_or_span: "This release fixes four security issues, all of them reached through `web_fetch_tool` or OpenTelemetry instrumentation."
        ref_type: quote
      - uri: "https://github.com/pydantic/pydantic-ai/releases/tag/v2.44.0"
        quote_or_span: "`web_fetch` processed responses in superlinear time on the event loop, in both the HTML conversion and the charset decode, so a single attacker-chosen page could stall every agent in the process."
        ref_type: quote
      - uri: "https://github.com/pydantic/pydantic-ai/releases/tag/v2.44.0"
        quote_or_span: "`web_fetch_tool`'s domain lists were compared as written rather than in the form the resolver uses, so a blocked domain could be reached under another spelling."
        ref_type: quote
      - uri: "https://github.com/pydantic/pydantic-ai/releases/tag/v2.44.0"
        quote_or_span: "with `InstrumentationSettings(include_content=False)`, spans still carried exceptions, error statuses, instructions and the output template."
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Two advisories are rated moderate and two low by the maintainers; the blocklist bypass requires a URL opted into local network access, which the release says is off by default."
      - "Severity labels are the project's own; no CVSS scores or CVE identifiers appear in the release note."
