  content: AISI's RealityTest contains 3,152 identity-probing queries from roughly 750 participants across
    five languages. It tests 17 text and six speech models; a suppression instruction pushed disclosure
    below 30% even for the best performers. Anthropic's separate 120-query VirBench tests viral-sequence
    retrieval, not general tool correctness. Adding gget virus raised reported accuracy above 90% for
    all tested agents, reaching 99.7% for GPT-5.5.
  source_refs:
  - uri: https://www.aisi.gov.uk/research/realitytest-how-people-probe-ai-identity-and-whether-models-disclose-it
    quote_or_span: 'Abstract: 3,152 queries, approximately 750 participants, 17 text/6 speech models,
      five languages; suppression reduces even best disclosure below 30%.'
