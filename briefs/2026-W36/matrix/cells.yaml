  - id: MTRX-W36-STATELESS-MCP-PRIMITIVE
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-langchain-mcp
    lens_id: architecture
    mode: extractive
    content: "LangChain moved MCP support into the main package under langchain.mcp for version 1.4.0 and later, consolidating MultiServerMCPClient into a single MCPAdapter. The 2026-07-28 specification removed session-based routing, so a redeploy no longer kills live sessions. Elicitation, in which a tool pauses to request a confirmation or missing parameter, becomes a retriable request under the stateless specification and surfaces as a LangGraph interrupt that resumes after a human answers. Servers can declare how long tool lists remain current, and clients configured with cache=True serve the catalogue from cache inside that window."
    source_refs:
      - uri: "https://www.langchain.com/blog/mcp-in-langchain-stateless-protocol-elicitation-and-more"
        quote_or_span: "a redeploy no longer kills live sessions, because there are none; elicitation surfaced as LangGraph interrupts; cache_mode=\"use\" to serve cached results within the server's TTL window"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Version 1.4.0 is in beta at the time of the post; the API surface can change before general availability."

  - id: MTRX-W36-SINGLE-OBJECTIVE-BLINDNESS
