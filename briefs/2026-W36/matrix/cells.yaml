    source_item_id: src-w36-ecommerce-bench
    lens_id: eval
    mode: extractive
    content: "E-Commerce Bench, submitted 2026-08-31, evaluates 18 frontier models over a simulated 365-day business operation across seven dimensions, with deterministic customer demand and a deterministic negotiation kernel using an LLM only to verbalise counterpart decisions. The top earner grew a 100,000 opening stake to 1,431,425 while ranking 16th of 18 on fraud avoidance and trailing another model on operational efficiency; the strongest open-weight entrant reached 416,252 and showed the strongest learning across the horizon."
    source_refs:
      - uri: "https://arxiv.org/abs/2608.30730"
        quote_or_span: "growing the 100,000 opening stake into 1,431,425, yet it ranks 16th of 18 on fraud avoidance and trails Fable5 in operational efficiency"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Results are bound to one benchmark with a fixed demand model and a scripted negotiation kernel; the fraud-avoidance dimension is defined by the authors."

  - id: MTRX-W36-INDEPENDENT-EVAL-SEPARATION
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-harness-of-harness
    lens_id: workflow
    mode: extractive
    content: "Harness-of-Harness, submitted 2026-09-01, runs on top of existing coding-agent harnesses and organises their executions into iterative planning, coding, and testing loops. It balances repair against capability growth, scopes development into small verifiable increments, separates implementation-time testing from independent evaluation, and constrains verifiable outputs instead of prescribing agent workflows, while keeping versioned project histories. Across GameCraft-Bench, FrontierSWE, and ProgramBench it reports an average relative gain of 52.25 percent and a maximum of 82.86 percent after three iterations."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.01481"
        quote_or_span: "separates implementation-time testing from independent evaluation, and constrains verifiable outputs rather than prescribing agent workflows; an average relative gain of 52.25 percent and a maximum gain of 82.86 percent after three iterations"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Gains are reported on three benchmark suites chosen by the authors, with no independent reproduction."

  - id: MTRX-W36-TRAFFIC-FITTED-MODEL
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-production-traffic-post-training
    lens_id: architecture
    mode: extractive
    content: "From Production Traffic to Post-Training, submitted 2026-09-01, consolidates traffic from more than 200 internal applications onto one self-hosted model. Production error analysis identified semantic collapse, over-calling, and verbosity hacking as failure axes; each received a GRPO expert, merged in two SLERP stages to avoid cross-domain reward interference. On the authors' in-house arena the result scores 69.6 against 65.8 for a baseline roughly seven times larger, with instruction following at 0.85 against 0.83 and function calling at 0.79 against 0.77, and the deployed model absorbs 50 percent of platform traffic at 116 million requests a month."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.01572"
        quote_or_span: "69.6 vs 65.8 (baseline ~7x larger); absorbs 50% of platform traffic, 116M requests per month; two-stage SLERP to avoid cross-domain reward interference"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Comparison is on the authors' internal arena against their own traffic distribution; the margin is a statement about distribution fit and does not generalise to other request mixes."

  - id: MTRX-W36-MANDATE-BEFORE-WORK
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-paypal-approval-token
    lens_id: governance
    mode: extractive
    content: "In a talk released 2026-09-01, PayPal's Jay Mok and Ben Coumes describe an approval token that inverts the synchronous order: the user approves before the agent has found an item or picked a merchant, and PayPal returns a JSON payload carrying the amount, the expiry, and the merchant the agent is permitted to transact with. The talk frames agent authorization around three questions: did the human authorize this, is it allowed right now in this scope, and can it be proven later. India is separately preparing a Unified Agent Protocol for UPI using delegated authority, blocked funds, spending limits, identity checks, audit trails, and a liability framework."
    source_refs:
      - uri: "https://www.youtube.com/watch?v=vGn6N4-bxBY"
        quote_or_span: "the user approves before the agent has found an item or picked a merchant, and PayPal returns a JSON payload carrying the amount, the expiry, and the merchant the agent is permitted to transact with"
        ref_type: quote
      - uri: "https://www.reuters.com/world/india/india-preparing-rollout-agentic-payments-upi-sources-say-2026-09-01/"
        quote_or_span: "delegated authority, blocked funds, spending limits, identity checks, audit trails, and a liability framework"
        ref_type: url
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The PayPal token was described as days from shipping at recording time; treat it as announced, not generally available."
      - "Quoted content is taken from the conference feed's published description of the talk, not from a transcript of the recording."

  - id: MTRX-W36-VERIFY-EFFECT-NOT-SIGNATURE
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-x402-settlement-gap
    lens_id: governance
    mode: extractive
    content: "In a talk released 2026-09-01, Apify's Jan Curn describes the gap in the x402 protocol between a server verifying a payment signature and the payment settling on chain: a client can mint many signatures against one wallet, so a seller that begins work on the strength of verification alone is exposed, and the workaround of settling first suits a fixed-price API call and fits poorly with slower work. Curn reports shipping x402 two days before the talk, moving an Apify marketplace from roughly 2,000 tools to 20,000."
    source_refs:
      - uri: "https://www.youtube.com/watch?v=h6mi88VrPtQ"
        quote_or_span: "a client can mint a thousand signatures against one wallet, so any seller starting real work on the strength of a verification is exposed"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Single practitioner account of a protocol weakness; no published exploit or loss report corroborates the exposure."
      - "Quoted content comes from the conference feed's published description, not from a transcript."

