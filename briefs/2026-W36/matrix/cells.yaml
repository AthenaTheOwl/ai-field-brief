  - id: MTRX-W36-CACHE-MISS-CAUSES
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-claude-code-cache-fixes
    lens_id: observability
    mode: interpretive
    content: "Claude Code releases 2.1.259 (2026-09-02) and 2.1.260 (2026-09-03) fix four causes of silent prompt-cache misses: context attached after tool results re-sent uncached on every tool-call turn on Fable 5.1; the cache invalidated on OAuth token refresh in sessions with telemetry disabled; a blocking Stop hook costing the next turn its reasoning and, on some models, its cache hit; and mid-session /effort changes invalidating the cache. The same releases add a per-session prompt-cache line to /cost carrying hit ratio, misses, tokens re-cached, and warm or cold state, a prompt_cache status-line object, and an attributed likely cause for each miss."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
        quote_or_span: "Fixed prompt caching on Claude Fable 5.1 not covering the context attached after tool results, so it was re-sent as uncached input on every tool-call turn"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
        quote_or_span: "Added a likely cause for prompt-cache misses (e.g. tool definitions or system prompt changed, idle past the TTL) to /cost and the status line's prompt_cache field"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Grouping four separate changelog entries as one class of silent-miss defect is this brief's interpretation, not the vendor's framing."

  - id: MTRX-W36-CRITICAL-CYBER-EXTERNAL-MONITOR
    matrix_run_id: MTRX-W36-controls-outside-the-model
    source_item_id: src-w36-gpt6-astra-safety
    lens_id: security
    mode: extractive
    content: "OpenAI released GPT-6 Astra on 2026-09-03 as the first model meeting the Critical cybersecurity capability threshold under its Preparedness Framework, on the finding that it can autonomously discover previously unknown weaknesses and build working exploits against well-defended systems. Shipped controls include misalignment monitoring across all tool-using inference, described as classifiers checking the model's reasoning and actions for unauthorized behavior and automatically stopping potentially unauthorized activity; enterprise access off by default; refusal of advanced cyber tasks including proof-of-concept exploit creation; and a stated plan to relax safeguards for defensive workflows through a separate program."
    source_refs:
      - uri: "https://openai.com/index/safety-overview-gpt-6-astra/"
        quote_or_span: "a system of classifiers that checks the model's reasoning and actions for unauthorized behavior and automatically stops potentially unauthorized activity"
        ref_type: quote
      - uri: "https://developers.openai.com/api/docs/changelog"
        quote_or_span: "September 3, 2026 - gpt-6-astra; Misalignment monitoring was added for asynchronous safety checks on supported requests; tool calling requires the Responses API exclusively"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The safety overview returned HTTP 403 to this agent. Quoted language reached this cell through reporting that cites the overview directly; the accompanying developer changelog entry was read at source and independently records misalignment monitoring and the Responses API constraint for the same date."

