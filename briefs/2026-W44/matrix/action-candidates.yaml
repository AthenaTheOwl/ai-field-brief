  surface: security
  test_plan: Assert configured context length is at or below measured cache capacity; send one canary prompt just over
    capacity and require an explicit error.
  expected_benefit: A capacity mismatch fails a test before launch instead of returning a plausible answer.
  risk: Applies directly only to self-hosted inference; hosted-API users cannot see provider pool sizes.
  disposition: prototype
  success_metric: Over-capacity canary returns an error on every run; no canary text from one request appears in another.
  rollback: Remove the boundary test; no serving config changes.
  kill_criterion: Stop if no self-hosted inference path exists in the target project.
