  surface: observability
  test_plan: Call one MCP tool with canary argument and result; search exported spans for both before and after an SDK
    upgrade; set the capture flag explicitly.
  expected_benefit: A tracing default change cannot silently widen what the trace store holds.
  risk: Release and pull request establish the default change, not what any given deployment records today.
  disposition: adopt_now
  success_metric: Canary strings present or absent exactly as the explicit flag says, across two SDK versions.
  rollback: Revert the pin and the flag.
  kill_criterion: Stop if the project does not trace MCP calls with this SDK.
