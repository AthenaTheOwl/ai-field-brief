- cell_id: MTRX-W44-JIT-adoption_action
  source_published_at: '2026-10-29'
  interpretation: true
  source_support:
  - MTRX-W44-JIT-source_gist
  - MTRX-W44-JIT-mechanism_extraction
  - MTRX-W44-JIT-risk_and_caveats
  surface: workflow
  test_plan: For ten agent-authored diffs, generate tests that pass on the parent and fail on the diff; keep deterministic
    failures; label each intended, bug or noise.
  expected_benefit: Review attention goes to concrete behavior changes instead of rereading the diff.
  risk: Meta's figures are self-reported on its own codebase; the true-positive rate is engineer-reported and the SEV
    reduction is attributed without a control.
  disposition: prototype
  success_metric: Share of surviving failing tests labelled real bug or unintended change.
  rollback: Discard generated tests; no CI change.
  kill_criterion: Stop if fewer than one in ten surviving tests is labelled a real bug or unintended change.
