# 1. Cloudflare GLM-5.3 cross-request KV cache exposure (security)
- id: MTRX-W44-CFKV-source_gist
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-cloudflare-kv
  lens_id: source_gist
  mode: extractive
  content: Cloudflare disclosed on October 26 that its GLM-5.3 Workers AI deployment returned other customers'
    data in 155 responses between August 27 and September 9, all to prompts longer than 681,280 tokens. The model
    was advertised with a 1,048,576-token context window while the prefill KV cache pool held 681,280 tokens.
  structured:
    source_published_at: '2026-10-26'
    interpretation: false
  source_refs:
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: In total, 155 responses were affected, all to prompts longer than 681,280 tokens.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We deployed GLM 5.3 with a 1,048,576-token context window, but the KV cache pool on our prefill
      GPUs only had room for 681,280 tokens.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: Between August 27 and September 9, a small number of customers using the GLM 5.3 Workers AI model
      received responses that contained data from other customers' requests made to the same model shortly before
      theirs.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We have remediated the issue, and we restored the model on September 9.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: Today we are publishing this report alongside a post from SGLang, the open-source inference engine
      that we use, as a coordinated disclosure.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: 'Page metadata datePublished 2026-10-26T22:01:23.889Z; byline date October 26, 2026.'
    ref_type: timestamp
  confidence: high
  faithfulness_status: passed
  status: verified
  warnings:
  - The incident window is August 27 to September 9; only the disclosure is dated inside this issue's window. The
    155 count is Cloudflare's own tally of affected responses, excluding nothing it states beyond its own and the
    researcher's testing.
- id: MTRX-W44-CFKV-mechanism_extraction
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-cloudflare-kv
  lens_id: mechanism_extraction
  mode: extractive
  content: An over-length prompt was marked rejected inside SGLang's disaggregated prefill/decode path and replaced
    with a one-token placeholder. Prefill still transferred a cache, decode received "transfer complete" and generated
    over stale pages from earlier requests. Cloudflare expected an error; its long-context tests returned successful
    responses, so the mismatch was not treated as an issue before launch.
  structured:
    source_published_at: '2026-10-26'
    interpretation: false
  source_refs:
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We expected the engine to return an error for any prompt it could not process, and our long-context
      tests returned successful responses, so we did not believe this to be an issue.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: The decode node received a "transfer complete" message and assumed that prefill overwrote the KV
      cache from previous requests with the full prompt for this request, when in fact it left the majority of the
      previous state intact.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: In both cases the result is corrupted output, or one user's data in another user's response, with
      no error raised.
    ref_type: quote
  confidence: high
  faithfulness_status: passed
  status: verified
  warnings:
  - The no-error sentence describes the related race and page-lifetime bug classes; Cloudflare says this incident's
    rejected request went through the handoff every time, not by a timing accident, with the same result.
- id: MTRX-W44-CFKV-risk_and_caveats
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-cloudflare-kv
  lens_id: risk_and_caveats
  mode: critique
  content: Cloudflare reports no evidence of deliberate exploitation and says no other Workers AI model was affected.
    It calls pool size alone a fragile guard because quantization, tensor parallelism, CUDA graph sizes or a new model
    version can change it, and now checks pool size against context length on every disaggregated deployment change.
    Operators are told to move to SGLang v0.5.22 or later.
  structured:
    source_published_at: '2026-10-26'
    interpretation: false
  source_refs:
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We found no evidence of deliberate exploitation.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: 'Relying on pool size alone is fragile: any change to quantization, tensor parallelism, CUDA graph
      sizes, or a future model version changes the pool size in a way that''s easy to miss.'
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: 'Added a check to every disaggregated deployment change: KV pool size measured against context length,
      deferred release on both roles, transfer batch bounds inside the release timeout, and all required patches applied.'
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We highly recommend all operators update SGLang dependencies to v0.5.22 or later.
    ref_type: quote
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: the prefill KV pool now holds about 2.04 million tokens, roughly twice the 1,048,576-token context
      length.
    ref_type: quote
  confidence: high
  faithfulness_status: passed
  status: verified
  warnings:
  - The fix applies to operators running SGLang in disaggregated prefill/decode mode. API customers cannot inspect a
    provider's pool size; for them the transferable part is the test design, not the patch.
- id: MTRX-W44-CFKV-adoption_action
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-cloudflare-kv
  lens_id: adoption_action
  mode: interpretive
  content: Proposed test, not run for this issue. For any self-hosted inference config, assert that the configured
    context length does not exceed the measured cache capacity, and add one boundary test that sends a prompt just
    over the capacity with a unique canary and requires an explicit error. A successful response to that prompt fails
    the test.
  structured:
    source_published_at: '2026-10-26'
    interpretation: true
  source_refs:
  - uri: https://blog.cloudflare.com/kv-cache-exposure-remediation/
    quote_or_span: We validated both changes against the researcher's reproduction script and our own canary-marker
      tests before restoring the model.
    ref_type: quote
  confidence: medium
  faithfulness_status: passed
  status: verified
  warnings:
  - Editor's proposal derived from the incident. Cloudflare's own canary-marker tests are mentioned but not specified.

