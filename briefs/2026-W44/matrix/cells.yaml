# 3. Ai2 novelty judges (eval)
- id: MTRX-W44-NOVELTY-source_gist
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-ai2-novelty
  lens_id: source_gist
  mode: extractive
  content: Ai2 published a benchmark of LLM novelty judges on October 27. Switching GPT-5.4 from a prompt that said
    exactly one idea per pair was novel to one that simply asked which idea was novel dropped its accuracy on
    human-versus-generated pairs from 93.5% to 40.9% and changed more than half its verdicts. The same change moved
    accuracy about seven points on human-only pairs.
  structured:
    source_published_at: '2026-10-27'
    interpretation: false
  source_refs:
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: When we switched to the simpler prompt, accuracy dropped from 93.5% to 40.9% – below chance – and the
      model changed its verdict on more than half of the same pairs.
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: By contrast, the same prompt change shifted accuracy by only about seven percentage points on the Human-Only
      dataset
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: 'Page byline: Published October 27, 2026.'
    ref_type: timestamp
  confidence: high
  faithfulness_status: passed
  status: verified
  warnings:
  - The 93.5% prompt told the model that reviewers had found exactly one idea in each pair novel, which gives the judge
    the answer's structure. The drop measures sensitivity to that framing on one model, not a typical prompt-wording
    effect.
  - Labels for generated ideas are weak; Ai2 assumed they were less novel than the paired top-10% ICLR ideas.
- id: MTRX-W44-NOVELTY-mechanism_extraction
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-ai2-novelty
  lens_id: mechanism_extraction
  mode: extractive
  content: A judge validated on human-written work can behave differently on generated work. Across prompt changes,
    a quarter to a third of verdicts comparing two generators flipped on average, a disagreement Ai2 notes can be
    measured without trusting any label. A simple three-call Claude Opus 4.6 prompt scored 0.854 macro-F1 for $2.59
    total, against 0.642 for $30.66 and 0.772 for $82.05 from two purpose-built evaluators.
  structured:
    source_published_at: '2026-10-27'
    interpretation: false
  source_refs:
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: Across the tested prompt changes, roughly a quarter to a third of verdicts changed on average across
      six judges.
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: On the Human+Generated set, a simple Claude Opus 4.6 prompt using low reasoning and majority voting
      across three calls achieved 0.854 macro-F1 at a total evaluation cost of $2.59.
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: Idea Novelty Checker, a literature-grounded retrieval and reranking pipeline, scored 0.642 at $30.66,
      while Sakana AI's AI Scientist, whose novelty evaluator iteratively searches Semantic Scholar, scored 0.772 at
      $82.05.
    ref_type: quote
  confidence: high
  faithfulness_status: passed
  status: verified
  warnings:
  - The macro-F1 and cost comparisons rely on the weak labels for generated ideas. The verdict-flip rate does not.
- id: MTRX-W44-NOVELTY-risk_and_caveats
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-ai2-novelty
  lens_id: risk_and_caveats
  mode: critique
  content: The judge task is research-idea novelty, a narrow and label-poor task. Human-only pairs were not immune;
    the same change moved Claude Opus 4.6 by 21 points. Ai2 recommends testing judges on the kinds of items they will
    grade in production and measuring sensitivity across prompts and models. Transfer to code-review or summary judges is
    a hypothesis.
  structured:
    source_published_at: '2026-10-27'
    interpretation: true
  source_refs:
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: the same change moved Claude Opus 4.6 accuracy by 21 points
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: Future work should test judges on the kinds of ideas they will actually evaluate, measure sensitivity
      across prompts and models
    ref_type: quote
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: We assumed the generated ideas were less novel than their human-authored counterparts; these are weak
      labels, not verified judgments for every idea.
    ref_type: quote
  confidence: medium
  faithfulness_status: passed
  status: verified
- id: MTRX-W44-NOVELTY-adoption_action
  matrix_run_id: MTRX-W44-reported-success
  source_item_id: src-w44-ai2-novelty
  lens_id: adoption_action
  mode: interpretive
  content: Proposed test, not run for this issue. Take one LLM judge already used in a pipeline, write two reasonable
    prompt variants, run both over 30 recent items of the kind it grades in production, and report the share of
    flipped verdicts. A flip rate needs no gold labels.
  structured:
    source_published_at: '2026-10-27'
    interpretation: true
  source_refs:
  - uri: https://huggingface.co/blog/allenai/novelty-bench
    quote_or_span: If two reasonable evaluation setups give opposite answers for the same pair of ideas, that disagreement
      itself reveals instability.
    ref_type: quote
  confidence: medium
  faithfulness_status: passed
  status: verified

# 4. Coding-agent trust boundaries: Claude Code 2.1.314 and deepagents-code 0.2.2 (tool-policy)
