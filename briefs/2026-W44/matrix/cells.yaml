  lens_id: source_gist
  mode: extractive
  content: Claude Code 2.1.314, published October 30 UTC, adds a setting that makes Write, Edit and NotebookEdit refuse
    paths outside the working directories in every permission mode. The same release fixes blocked shell and MCP calls
    reading as if they ran in a collapsed tool group, sandbox protections missing from a worktree entered by a resumed headless session, and an
    excluded settings file still supplying auto mode rules and saved permission consents.
  structured:
    source_published_at: '2026-10-30'
    interpretation: false
  source_refs:
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.314
    quote_or_span: 'Added `permissions.blockWritesOutsideWorkingDirectories`: Write, Edit and NotebookEdit refuse paths
      outside the working directories in every permission mode'
    ref_type: quote
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.314
    quote_or_span: Fixed shell and MCP calls that auto mode, a deny rule or a PreToolUse hook blocked, or that otherwise
      did not run, reading as if they ran in a collapsed tool group
    ref_type: quote
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.314
    quote_or_span: Fixed sandbox protections not applying to a worktree entered by `claude -p --resume` or `--continue`
    ref_type: quote
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.314
    quote_or_span: Fixed a settings file excluded with `--setting-sources` still supplying some settings, such as auto
      mode rules and saved permission consents
    ref_type: quote
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.314
    quote_or_span: GitHub release published_at 2026-10-30T01:06:26Z.
    ref_type: timestamp
  confidence: high
  faithfulness_status: passed
  status: verified
