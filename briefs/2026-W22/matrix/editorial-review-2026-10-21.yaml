- id: MTRX-W22-EARLY-04
  matrix_run_id: MTRX-W22-EDITORIAL-2026-10-21
  source_item_id: editorial-w22-signal-04
  lens_id: editorial_source_review
  mode: critique
  content: 'Three platforms shipped the same shape in the same

    week. Claude Code v2.1.154 set Opus 4.8 as default, exposed an

    `/effort xhigh` knob for the hardest tasks, made the lean system

    prompt default for new models, and introduced "dynamic workflows"

    that orchestrate tens to hundreds of background agents via

    `/workflows`. Two days later v2.1.156 hotfixed an Opus 4.8

    thinking-block regression. Cursor''s Auto-review introduced a

    three-tier action policy: allowlist immediate, sandboxable

    isolated, classifier-routed for the ambiguous middle (permit /

    alternative / human prompt). Vercel added a team-wide AI Gateway

    provider allowlist enforced on BYOK traffic with owner-only

    mutation.'
  source_refs:
  - uri: https://github.com/anthropics/claude-code/releases/tag/v2.1.154
    quote_or_span: 'May 28 release: dynamic workflows, Opus 4.8 and effort settings are workflow/model
      controls.'
    ref_type: chunk
  - uri: https://cursor.com/changelog/auto-review
    quote_or_span: 'May 29: allowlisted calls, sandboxed calls, then classifier subagent choosing permit/alternative/human
      approval.'
    ref_type: chunk
  - uri: https://vercel.com/changelog/team-wide-provider-allowlist-on-ai-gateway
    quote_or_span: 'May 28 opening: team-wide provider allowlist applies to every Gateway request including
      BYOK; provider eligibility is distinct from tool authorization.'
    ref_type: chunk
