- id: MTRX-W22-EARLY-03
  matrix_run_id: MTRX-W22-EDITORIAL-2026-10-21
  source_item_id: editorial-w22-signal-03
  lens_id: editorial_source_review
  mode: critique
  content: 'Microsoft Copilot Cowork agents could send messages

    containing attacker-supplied external images; opening the message

    triggered a network request whose URL carried exfiltrated data.

    Anthropic''s Alignment Science team published SLEIGHT-Bench, a

    benchmark of evasive transcripts designed to surface blind spots

    in frontier monitor systems before deployment. The two land on the

    same page because they are the offense and defense of the same chain:

    agent composes outbound content → outbound content carries

    attacker-influenced payload → no monitor catches the chain.'
  source_refs:
  - uri: https://www.promptarmor.com/resources/microsoft-copilot-cowork-exfiltrates-files
    quote_or_span: 'Attack walkthrough steps 3–6: self-addressed Teams message embeds attacker image URL
      containing pre-authenticated file download links; rendering triggers exfiltration.'
    ref_type: chunk
  - uri: https://alignment.anthropic.com/2026/sleight-bench/
    quote_or_span: 'May 19; approach and harms: constructed, internally checked evasive transcripts test
      monitor blind spots. This is not a deployed exfiltration-control evaluation.'
    ref_type: chunk
  confidence: medium
