  - id: MTRX-W40-COMPRESSION-LATENCY-PENALTY
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-compression-study
    lens_id: cost
    mode: extractive
    content: "Varying what to compress, when to compress and how much to remove as independent knobs across three open-weight models on SWE-bench Verified and Terminal-Bench 1.0 over nearly 35,000 runs, the authors find fewer tokens need not mean faster or cheaper: on Terminal-Bench with Qwen, policies using roughly one-third as many tokens can take 20 to 80% longer than the uncompressed agent."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.32961"
        quote_or_span: "We find that fewer tokens need not mean faster or cheaper execution: on Terminal-Bench with Qwen, policies using roughly one-third as many tokens can take 20-80% longer than the uncompressed agent."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.32961"
        quote_or_span: "Across nearly 35,000 agent runs, we measure task success, token use, end-to-end latency, and estimated cost."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.32961"
        quote_or_span: "arXiv abs submission history: [v1] Sat, 26 Sep 2026 21:46:40 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 20 to 80% latency penalty is one stratum (Terminal-Bench with Qwen), not the full three-model by two-benchmark grid, and 80% is the upper end rather than a typical value."
      - "Cost is estimated cost in the source; only success, token use and end-to-end latency are measured directly."
      - "The source hedges that policies with similar overall success can solve different tasks; reading that as equal aggregate success is firmer than the original."
  - id: MTRX-W40-OTEL-PROMPT-DUPLICATE
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-claude-code-2-1-287
    lens_id: observability
    mode: extractive
    content: "Claude Code 2.1.287, published 2026-10-01, adds prompt_text to the OpenTelemetry user_prompt event as a copy of prompt for backends that nest dotted keys, and tells operators to drop or mask it wherever they already drop or mask prompt. The same release ships Claude Mods, plugins that modify deeper behaviour."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.287"
        quote_or_span: "Added `prompt_text` to the OpenTelemetry `user_prompt` event, a copy of `prompt` for backends that nest dotted keys; drop or mask it wherever you drop or mask `prompt`"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.287"
        quote_or_span: "Added Claude Mods: plugins may now modify deeper behavior"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.287"
        quote_or_span: "release published_at 2026-10-01T18:00:22Z"
