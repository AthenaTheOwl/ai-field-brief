  - id: MTRX-W40-GATE-STRICTNESS-CORRELATION
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-correlated-tests
    lens_id: eval
    mode: extractive
    content: "Treating a release gate as a design problem under a two-class latent-factor model, the paper reports that a 99 percent reliability target needs 8 independent tests, 74 tests at a latent correlation of 0.3, and 5,182 at 0.5, where the gate keeps fewer than one good model in ten; pass-all gating drives the share of good models kept to zero as the suite grows."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.00993"
        quote_or_span: "In one configuration, a 99 percent target needs 8 independent tests, but 74 tests at a latent correlation of 0.3 and 5,182 at 0.5, where the gate keeps fewer than one good model in ten."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.00993"
        quote_or_span: "arXiv abs page submission history: [v1] Thu, 1 Oct 2026 03:27:54 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 8 / 74 / 5,182 counts are explicitly in one configuration of the paper's model: analytic output under its assumptions, not measurements on real eval suites."
      - "Stricter is always more reliable is proved only where both classes share the same latent correlation, and the one-good-model-in-ten figure attaches to the 0.5 case."
      - "The binomial validation procedure certifies a gate chosen from a fixed shortlist, not an arbitrary gate."
  - id: MTRX-W40-AUDIENCE-ADMISSION-LEAK
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-audience-bound-memory
    lens_id: security
    mode: extractive
    content: "Over 10,000 multi-party histories in a prospectively frozen confirmation, no forbidden memory item entered any architecture's context under audience-bound admission, while unscoped retrieval exposed forbidden items in 82% of its contexts."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.36373"
        quote_or_span: "In a prospectively frozen confirmation over 10,000 multi-party histories, no forbidden item entered any architecture's context, whereas unscoped retrieval exposed forbidden items in 82% of its contexts."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.36373"
        quote_or_span: "arXiv abs submission history: [v1] Mon, 28 Sep 2026 23:04:54 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 0% / 82% contrast is the authors' own harness over 10,000 synthetic multi-party histories against their own unscoped-retrieval baseline. It measures their construction, not leak rates in deployed agents."
      - "The wrong-principal result is inconclusive by the authors' own statement: unscoped substitutions were too rare to establish the prespecified joint decision."
      - "Two of the three realizations are independently persisted reference architectures (a flat store and a relationship graph); the native agent-memory runtime is realized only descriptively."
  - id: MTRX-W40-ADMISSION-BY-EXCLUSION
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-audience-bound-memory
    lens_id: security
    mode: extractive
    content: "Every memory item records the audience present when it was written, derived items are partitioned by audience or take the intersection of their sources' audiences or are suppressed, audiences widen only by explicit object-specific grant, and an item enters a model call only when every current viewer is authorized, with unresolved viewers failing closed to public-only. Enforcement is by exclusion from the assembled context, not by model behaviour."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.36373"
        quote_or_span: "this admission is sound and policy-complete on the exact assembled context, enforced by exclusion rather than by model behavior"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Soundness and policy-completeness are claimed only under explicit identity, provenance and complete-mediation assumptions, and only on the exact assembled context."
  - id: MTRX-W40-PACE-LAST-BOUNDARY
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-pace
    lens_id: security
    mode: extractive
    content: "PACE argues that admission-time vetting of tool metadata, retrieved pages, memory and skills does not settle the question, because safe and leaking variants produce identical admission evidence, so it mediates every tool call immediately before execution, checking schema-defined effects against authority compiled from the authenticated request and requiring the final action to preserve a certified influence-path cut."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.01349"
        quote_or_span: "We present Provenance-Aware Capability Enforcement (PACE), which mediates every tool call immediately before it executes. Path confinement proposes an executable cut of represented influence paths"
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.01349"
        quote_or_span: "arXiv abs page submission history: [v1] Thu, 1 Oct 2026 09:18:05 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The abstract says admission-time vetting does not settle this and that a sound gate cannot relax that site for either variant, which is weaker than vetting being unworkable."
  - id: MTRX-W40-PACE-ATTACK-COLUMNS
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-pace
    lens_id: security
    mode: extractive
    content: "On eight executable agent-security benchmarks with three target-model families, the evaluated configuration gives strictly lowest attack success in 62 of 79 eligible attack columns and ties in 14, with full-benchmark native utility losing at most three points against the undefended agent."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.01349"
        quote_or_span: "the evaluated configuration gives strictly lowest attack success in 62 of 79 eligible attack columns and ties in 14; full-benchmark native utility loses at most three points relative to the undefended agent"
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The headline belongs to the evaluated configuration, which the paper distinguishes from the certified execution contract and which can restore an authorized call after a proposed block or apply a declared repair. The number is not a property of the enforcement core alone."
      - "At most three points is a maximum on full-benchmark native utility, not a typical loss."
      - "The ablation over 1167 paired cases attributes most security gains to effect verification and refusal control to boundary adaptation; it never ranks effect verification against path confinement."
      - "Adaptive-attack evidence is limited to a reduced-scale search succeeding on 0 of 30 out-of-authority targets."
  - id: MTRX-W40-ALETHEIA-PERMISSION-MINIMALITY
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-aletheia
    lens_id: config
    mode: extractive
    content: "Aletheia treats repository instruction files of the AGENTS.md kind as an injection surface, compiles the authority a rule requests into a typed language, and synthesizes sandbox configurations that re-run the unchanged rule and task once per removed permission. A task that still passes under reduced authority yields a dispensability witness."
    source_refs:
      - uri: "https://arxiv.org/abs/2609.39678"
        quote_or_span: "Aletheia translates requested authority into a typed language and synthesizes executable sandbox configurations. It runs the unchanged rule and task under full permissions and independent restrictions that remove one permission at a time."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2609.39678"
        quote_or_span: "arXiv abs page submission history: [v1] Wed, 30 Sep 2026 13:09:24 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Flagging is a second, non-automatic step in the abstract: the witness is interpreted against task context to diagnose suspicious requests, rather than directly marking a request unnecessary."
      - "The abstract reports no runtime or sandbox-synthesis cost, so the per-permission re-run budget of the method is unstated."
  - id: MTRX-W40-ALETHEIA-DETECTION-RATES
