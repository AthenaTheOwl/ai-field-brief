  - id: MTRX-W40-ROUTER-ONCE-PER-THREAD
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-langchain-router
    lens_id: cost
    mode: extractive
    content: "The routing decision is made once, on the thread's first human message, by a classifier told to pick the least expensive model likely to finish the task, with LangChain middleware swapping the model and nothing else about the agent changing."
    source_refs:
      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "The router picks a model once, at the start of each thread, and that model is used for the whole thread."
        ref_type: quote
      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "pick the least expensive model likely to complete the task"
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The shipped classifier is no longer the LLM-with-structured-output the post describes; the post says it now runs on Jev, a newly released decision model, which made classification almost 50x faster."
      - "The post never tests per-call routing. Its stated contrast is harness-level routing against a generic gateway that lacks task-specific context, so any once-per-thread-versus-per-call comparison is the brief's, not the source's."
  - id: MTRX-W40-JEV-CLASSIFIER-PRICE
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-raschka-jev
    lens_id: cost
    mode: extractive
    content: "Raschka ran a decision-model classification API over the full 25,000-review IMDb test set and reports 96.47% accuracy in 22 minutes 24 seconds on 15,456,663 input tokens for $0.6492 total, against a fine-tuned ModernBERT that needed 23 minutes of training plus 7 minutes of evaluation to reach approximately 95%."
    source_refs:
      - uri: "https://magazine.sebastianraschka.com/p/classifier-history-and-jev"
        quote_or_span: "Choice: Accuracy 96.47% (24,117 correct) Total runtime: 22 minutes 24 seconds 15,456,663 input tokens, $0.6492 total cost"
        ref_type: quote
      - uri: "https://magazine.sebastianraschka.com/p/classifier-history-and-jev"
        quote_or_span: "For reference, a ModernBERT model took 23 min to fine-tune on the training set; 7 min to evaluate on the test set."
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The ModernBERT comparison is on task generality, not accuracy parity: the page puts ModernBERT at approximately 95%, which is roughly 1.3 to 1.5 points below the two decision-model endpoints."
      - "Single run on one dataset (IMDb binary sentiment, 25,000 reviews). The author reports repeated runs gave slightly different results, which he attributes to batch-dependent GPU kernel execution, and does not bound that noise."
      - "Cost is input-token dominated at about 618 tokens per review, so the per-call price moves proportionally with input length. Nothing in the post measures the model inside an agent harness."
  - id: MTRX-W40-GATEWAY-SPEND-UNDERCOUNT
