  - id: MTRX-W40-ROUTER-MEDIAN-COST
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-langchain-router
    lens_id: cost
    mode: extractive
    content: "LangChain routed Open SWE threads to a model tier chosen once per thread and reports the median routed thread at $0.94 against $2.61 on control, 64% less, with the mean down 42% and the p90 down 37%, over 973 threads split between the router and an always-frontier arm."
    source_refs:
      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "The median routed thread cost $0.94 vs. $2.61 on control, 64% less. The mean dropped 42% and the p90 dropped 37%"
        ref_type: quote
      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "Our first A/B test compared the router against always using our strongest model: half of threads went through the router, and half always used GPT-6 Astra, across 973 threads in total."
        ref_type: quote
      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "Compared to our previous baseline of always using a top-tier frontier model, it cut median cost per thread by 64% with no measurable change in quality."
        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The control arm always used a top-tier frontier model (GPT-6 Astra), which is the most expensive possible policy; the 64% is measured against that, not against a sensible fixed mid-tier default."
      - "Vendor post launching LangChain's own model-routing middleware, measured on LangChain's own internal agent with LangChain engineers as users. Cost window is Sep 16 to 22; the task-mix analysis is Aug 29 to Sep 5."
      - "The opposite control arm (always-fast) was abandoned within a day before it could produce statistically meaningful results."
      - "Tier models are GLM-5.3-Flash, GPT-5.6 Sol and GPT-6 Astra, so the ratios are specific to that ladder."
