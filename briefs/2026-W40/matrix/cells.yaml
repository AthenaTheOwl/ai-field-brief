      - uri: "https://www.langchain.com/blog/how-to-build-a-model-router-in-the-harness"
        quote_or_span: "29.2% of routed threads ended in a merged PR vs. 27.3% of control ( p = 0.49). PR open rates were also flat (38.9% vs. 39.6%, p = 0.82)."
