    faithfulness_status: passed
    status: verified
    warnings:
      - "The figure comes from a new benchmark of four scientific tasks in which a coding agent must find and correctly operate a published specialist model. It is not a general result about agents."
      - "The paper says only substantial run-to-run variability. Reading that as most observed differences between configs being noise at common sample sizes, or as single-run A/Bs being uninformative, is the brief's inference: no sample-size threshold is stated."
