  - id: MTRX-W40-RULE-PLACEMENT-DECAY
    matrix_run_id: MTRX-W40-same-configuration-run-twice
    source_item_id: src-w40-mem0-placement
    lens_id: context
    mode: extractive
    content: "Ten repository rules were placed three ways (in the working context, in a CLAUDE.md file, and in a retrieval layer) and run through repeated compaction. Rules held in the working context fell from 7 of 7 to 3 or 4 of 7 across three compactions; rules held in either memory form survived, and the two memory forms tied at 63 of 63."
    source_refs:
      - uri: "https://mem0.ai/blog/testing-memory-placement-against-compaction-cliff"
        quote_or_span: "Rules in the working context fell from 7 of 7 to 3 or 4 of 7 across three compactions. Rules in either memory form held."
        ref_type: quote
      - uri: "https://mem0.ai/blog/testing-memory-placement-against-compaction-cliff"
        quote_or_span: "The two memory forms tied at 63 of 63, so at ten rules a plain file is the right answer and costs nothing."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Scored over a clean-7 subset, not the ten rules placed: three questions were excluded because the model never applied those rules even at round 0."
      - "Small n: three repetitions of three compaction rounds each, and the per-repetition clean-7 scores at round 1 were 3, 6 and 7, so the decay is not uniform across runs."
      - "Vendor-run test whose conclusion does not favour the vendor: it shows a plain file matching the retrieval layer, and says so."
