- id: W28-LATE-SEC-001
  matrix_run_id: MTRX-W28-late-legible-harness
  source_item_id: W28-LATE-SEC-001
  lens_id: security
  mode: critique
  content: AgentRedBench reports 215 scenarios over 24 integrations and eight models, with no-guard attack success
    from 32 to 81 percent. Its learned AgentRedGuard reduces panel ASR from 69.9 to 2.4 percent at 0.37 percent
    false positives. These are benchmark estimates, not a deterministic authorization guarantee.
  source_refs:
  - uri: https://arxiv.org/html/2606.02240v1
    quote_or_span: 'Abstract; sections 4-5: 215 underspecified-authorization scenarios, 24 integrations, eight models;
      32%-81% no-guard ASR; learned integration-diverse guard; panel ASR 69.9% to 2.4%, 0.37% false positives.'
    ref_type: url
  confidence: medium
  faithfulness_status: passed
  status: verified
