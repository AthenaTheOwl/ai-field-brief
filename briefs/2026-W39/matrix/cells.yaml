  - id: MTRX-W39-CONTEXT-GROWTH-RATIO
    matrix_run_id: MTRX-W39-the-resolver-was-still-answering
    source_item_id: src-w39-claude-blog-context-growth
    lens_id: cost
    mode: extractive
    content: "Anthropic, posting 2026-09-24, reports that context per request has grown 2.6x and the input-to-output token ratio moved from 189:1 to 324:1, and prices Opus 5.5 against that shape by cutting cached-token read price 60%. It estimates Opus 5.5 costs about 40% less to run than Opus 5 for typical token-billed workloads."
    source_refs:
      - uri: "https://claude.com/blog/claude-opus-5-5-built-for-coding-sessions-that-use-more-context"
        quote_or_span: "Context per request has grown 2.6x. The input to output token ratio moved from 189:1 to 324:1."
        ref_type: quote
      - uri: "https://claude.com/blog/claude-opus-5-5-built-for-coding-sessions-that-use-more-context"
        quote_or_span: "post dateline September 24, 2026 on the claude.com/blog listing and on the post page"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 2.6x and the 189:1 to 324:1 shift are aggregate Claude Code usage data from March to September 2026 only - one product's traffic over six months, not API-wide or all-time. The post elsewhere states the growth as 'roughly 2.6x in six months'."
      - "The pricing change is two cuts, not one: input and output tokens down 20% and cached reads down 60%. Quoting only the 60% overstates how much of the saving is cache-specific."
      - "'About 40% less to run' is Anthropic's own estimate, for workloads billed by token, and the post says the largest differences land on longer, higher-context sessions - subscription users are not the referent."
      - "The same paragraph's 'a cached token on Opus 5.5 costs a fifth of what it does compared to competing models' is an unbenchmarked vendor comparison; it is not carried."
      - "Cache-read dominance is the vendor's characterisation of its own traffic, so driving a reader's cost model from cache-read price alone is an extrapolation from Anthropic's mix."
  - id: MTRX-W39-OPUS-55-CACHE-READ-CUT
    matrix_run_id: MTRX-W39-the-resolver-was-still-answering
    source_item_id: src-w39-anthropic-opus-5-5
    lens_id: cost
    mode: extractive
    content: "Claude Opus 5.5, announced 2026-09-22, cuts input and output to $4 and $20 per million (from $5 and $25) and cache reads to $0.20 per million (from $0.50), with a published table of all four price lines. A separate Fast mode at $8/$40 per million buys up to 2.5x speed in Claude Code and the Claude Platform."
    source_refs:
      - uri: "https://www.anthropic.com/claude-opus-5-5"
        quote_or_span: "Input and output tokens are $4 and $20 per million, 20% less than Opus 5. Cache reads (which make up the majority of agentic and coding work costs) are $0.20 per million tokens, 60% less than Opus 5."
        ref_type: quote
      - uri: "https://www.anthropic.com/claude-opus-5-5"
        quote_or_span: "anthropic.com/news index dateline Sep 22, 2026 for Introducing Claude Opus 5.5"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The headline '40% less than Opus 5 on typical workloads' is Anthropic's own test result at default settings, not a price line - it sits in the same paragraph as the quote and is easy to conflate with the 20%/60% list-price cuts."
      - "The 60% cut applies to cache reads alone. Cache writes fall only 20% ($6.25 to $5), and input/output 20%, so a workload that is write-heavy on cache sees far less than the headline."
      - "Fast mode at $8/$40 is 2x standard list price, so the cost story holds only outside Fast mode; 'up to 2.5x speed' is a ceiling, not a typical speedup, and is scoped to Claude Code and the Claude Platform."
      - "'Cache reads make up the majority of agentic and coding work costs' is Anthropic's characterization of customer workloads, not a figure the reader can check against their own bill."
