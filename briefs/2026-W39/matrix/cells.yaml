    source_refs:
      - uri: "https://developers.openai.com/api/docs/changelog"
        quote_or_span: "GPT-6 Luna: $0.10 input, $0.01 cached input, and $0.50 output."
        ref_type: quote
      - uri: "https://developers.openai.com/api/docs/changelog"
        quote_or_span: "changelog entry label Sep 22 under the September, 2026 heading"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The prices are the standard tier for prompts with up to 272K input tokens; the same entry points to pricing for cache writes, longer prompts and other processing tiers, so the twenty-fold spread holds only at that tier and context length."
      - "The twenty-fold spread is derived: $2/$0.10 input, $10/$0.50 output and $0.20/$0.01 cached each work out to 20x, but the source never characterises the gap."
      - "The URL is a rolling changelog with no per-entry permalink or anchor, so the Sep 22 entry moves down the page as entries accumulate - the citation cannot pin the dated item."
      - "A Sep 25 entry on the same page reports a bug in image encoding that degraded image understanding in GPT-6 Sol and GPT-6 Luna and recommends rerunning evaluations - directly relevant because the Sep 22 entry advertises image input."
