        quote_or_span: "Added Claude Opus 5.5 (`claude-opus-5-5`), now the default Opus model — 1M context, $4/$20 per Mtok with $0.20/Mtok cache reads"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.280"
        quote_or_span: "release published_at 2026-09-22T16:38:14Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
