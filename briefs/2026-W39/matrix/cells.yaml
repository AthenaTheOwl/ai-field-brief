      - "The quota recovery is attributed to two simultaneous changes - removing the 1M setting AND moving sub-agents to a cheaper model - so the effect is not isolated to the context-window setting, and no before/after numbers are given."
      - "The 90%-off-cached-input and reasoning-effort/tools-no-longer-busting-cache items are relayed from OpenAI's GPT-6 Sol/Luna launch, not ThursdAI's own hands-on testing; only the first sentence is first-hand."
