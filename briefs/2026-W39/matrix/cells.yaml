  - id: MTRX-W39-MCP-BODY-SIZE-CAP
    matrix_run_id: MTRX-W39-the-resolver-was-still-answering
    source_item_id: src-w39-mcp-hono-2-0-1
    lens_id: config
    mode: extractive
    content: "The MCP TypeScript SDK's 2.x releases of 2026-09-23 stop every SDK-owned body read at 4 MiB by default and answer 413 before parsing, configurable with a new maxRequestBodySize option, and limit JSON-RPC batch arrays to 100 messages with a longer batch refused whole as 400 / -32600. Hosts that pre-parse and pass parsedBody skip the size limit but not the batch bound, and Host/Origin validation now runs before the JSON body parser."
    source_refs:
      - uri: "https://github.com/modelcontextprotocol/typescript-sdk/releases/tag/%40modelcontextprotocol/hono%402.0.1"
        quote_or_span: "now stops at 4 MiB by default (the limit the legacy SSE transport already uses; the Express adapter and stdio bound their reads too)"
        ref_type: quote
      - uri: "https://github.com/modelcontextprotocol/typescript-sdk/releases/tag/%40modelcontextprotocol/hono%402.0.1"
        quote_or_span: "release published_at 2026-09-23T15:42:59Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 100-message batch bound applies even when a host pre-parses and passes parsedBody - only the byte limit is skipped."
      - "4 MiB is not new everywhere: the release states the legacy SSE transport already used that limit and that the Express adapter and stdio already bound their reads, so the change is new for the Streamable HTTP paths specifically."
      - "Two limits stack - the adapter's bound applies before the handler's, so raising only one leaves the 413."
      - "The same note ships in server@2.1.0, express@2.0.1 and node@2.1.0, so hono@2.0.1 is one of four 2.x releases carrying it. The v1.x backport 1.30.1 carries the change as a PR but does not ship the quoted note and never states the 4 MiB figure."
  - id: MTRX-W39-SOURCE-POINT-ENFORCEMENT
    matrix_run_id: MTRX-W39-the-resolver-was-still-answering
    source_item_id: src-w39-aws-tolap
    lens_id: security
    mode: extractive
    content: "TOLAP (Apache-2.0, published 2026-09-22) enforces column-, row-, field- and prefix-level policy inside the tool that holds the data connection, not in a layer above it, so restricted data never enters the context window. It ships a three-layer versioned policy schema, zero-dependency .NET, Python and TypeScript enforcement SDKs, a reference policy server, and fourteen framework integrations; multiple policies merge most-restrictive-wins."
    source_refs:
      - uri: "https://aws.amazon.com/blogs/opensource/introducing-tolap-object-level-access-control-for-ai-agent-tools/"
        quote_or_span: "Policy is applied where the data originates, not in a layer above it. The tool wraps the data source and enforces before anything crosses the boundary."
        ref_type: quote
      - uri: "https://aws.amazon.com/blogs/opensource/introducing-tolap-object-level-access-control-for-ai-agent-tools/"
        quote_or_span: "post byline by Phillip Spies on 22 SEP 2026; RSS pubDate Tue, 22 Sep 2026"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The quoted span drops the bolded lead-in 'Source-point enforcement.' that opens the paragraph and the following sentence ('There's no path to the data that skips enforcement.'); the two sentences quoted are contiguous and exact."
      - "The page's granularity list is wider than the four levels named here - it also covers tags, endpoints, HTTP methods, similarity thresholds and result limits."
      - "'Fourteen framework integrations' is the post's own count, spread across ten named frameworks and SDKs (MCP SDK, Strands, LangChain, LangChain.js, Vercel AI SDK, Mastra, OpenAI Agents, Pydantic AI, Semantic Kernel, Bedrock Agents)."
      - "Vendor announcement for a first-party AWS Labs project: the design argument and the enforcement claims are AWS's, with no third-party evaluation."
  - id: MTRX-W39-MCP-SCOPE-CHALLENGES
    matrix_run_id: MTRX-W39-the-resolver-was-still-answering
    source_item_id: src-w39-mcp-server-2-1-0
    lens_id: security
    mode: extractive
    content: "@modelcontextprotocol/server@2.1.0, published 2026-09-23, lets each tool, resource, resource template and prompt carry a scopeChallenge callback that receives the parsed request and verified auth info and either continues or returns the scope set for an insufficient_scope response; createMcpHandler and the Streamable HTTP transports then answer HTTP 403 with a WWW-Authenticate challenge before the handler runs or SSE is set up."
    source_refs:
      - uri: "https://github.com/modelcontextprotocol/typescript-sdk/releases/tag/%40modelcontextprotocol/server%402.1.0"
        quote_or_span: "Add request-time OAuth scope challenges for tools, resources, resource templates, and prompts."
        ref_type: quote
      - uri: "https://github.com/modelcontextprotocol/typescript-sdk/releases/tag/%40modelcontextprotocol/server%402.1.0"
        quote_or_span: "release published_at 2026-09-23T15:43:11Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "The preflight is opt-in per primitive - the release scopes it to whenever a registered primitive carries a scopeChallenge callback - so a tool or resource that declares no callback gets no 403 preflight."
      - "Enforcement is scoped to createMcpHandler and the Streamable HTTP transports; the release does not claim the preflight for stdio or other transports."
      - "The release also ships a requireScopes helper for static all-of checks, which is the simpler path most servers will use."
      - "In the raw changeset Markdown the sentence is soft-wrapped across two lines; it renders as a single line on the release page, so a byte-exact grep of the source file would miss it."
      - "This is a per-package monorepo tag, and the scope-challenge entry is the release's single Minor Change alongside several Patch Changes; it is not an SDK-wide release."
