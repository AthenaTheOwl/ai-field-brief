    content: "ThursdAI's 2026-09-25 issue carries a first-hand note that explicitly pinning a 1M-token context window in config invalidates OpenAI's prompt cache and burns quota. The same issue relays, from OpenAI's GPT-6 launch, that changing reasoning effort or the tool list no longer busts the cache and that cached input moved to 90% off."
    source_refs:
      - uri: "https://sub.thursdai.news/p/thursdai-sep-24-opus-55-beats-fable"
        quote_or_span: "I had previously set my context window to 1 million tokens via the se, which kills OpenAI's cache and rips through your quota."
        ref_type: quote
      - uri: "https://sub.thursdai.news/p/thursdai-sep-24-opus-55-beats-fable"
