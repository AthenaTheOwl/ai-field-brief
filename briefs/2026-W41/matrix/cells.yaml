  - id: MTRX-W41-SILENT-TOOL-LOSSES
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-claude-code-2-1-292
    lens_id: eval
    mode: extractive
    content: "In the same week Claude Code converted four quiet tool losses into loud ones: WebFetch dropped page text past 100,000 characters without saying so (fixed in 2.1.290, 2026-10-05), Grep and Glob reported no matches when the path could not be read, @-mentioned text files over 256KB were left out silently, and a PDF read with a list of pages returned only the first entry with no error (all fixed in 2.1.292, 2026-10-06)."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed WebFetch silently dropping page text past 100,000 characters; it now says how much was unread and takes an `offset` to read on"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed Grep and Glob reporting no matches when the file or folder they were given could not be read; Claude now retries once or tells you"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed @-mentioned text files over 256KB being left out silently: Claude is now told the file's size and to read it in portions"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed the Read tool returning only the first entry, with no error, when a PDF's `pages` was a list such as \"6,9,15\"; it now returns an error saying to read each page or range separately"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "release published_at 2026-10-06T18:59:30Z; v2.1.290 published_at 2026-10-05T23:33:17Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Fix notes only: the releases do not say how often each loss occurred or for how long, so the frequency of quiet tool failures in real sessions is not measured here."
      - "Pairing these fixes with the fault-injection paper is the brief's reading; neither source cites the other."
  - id: MTRX-W41-HOP-CHANGE-RATE
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-intent-execution
    lens_id: runtime-adapter
    mode: extractive
    content: "On a Windows corpus of 47,828 shell calls that Claude Code and Codex ran through Git Bash and Windows PowerShell 5.1 in 261 sessions, Claude Code's Bash launch changed 12.0% of the 7,491 exposed Bash calls (a heredoc, a backslash pair, or at least 1,000 characters), 67.0% of calls carrying a backslash pair and 100% of calls of at least 8,000 characters; for 80.7% of calls whose backslashes were changed, the wrong action ran with no reported error."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "In 47,828 shell calls within production sessions, Claude Code's Bash tool changes 12.0% of the calls that carry code, escape sequences, or long text."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "For 80.7% of the calls whose backslashes are changed, the wrong action runs without any reported error."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "The Windows corpus contains 47,828 shell calls that Claude Code and Codex ran through Git Bash and Windows PowerShell 5.1 in 261 sessions by 6 developers from a company over 11 weeks."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "12.0% of the 7,491 exposed Bash calls change. The rate is 67.0% for a call with a backslash pair and 100% for a call of at least 8,000 characters"
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "A Bash call is exposed when it carries a heredoc, a backslash pair, or at least 1,000 characters."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "arXiv [v1] Sat, 3 Oct 2026 08:38:35 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The 12.0% is a replay over one company's Windows corpus (six developers, eleven weeks, Git for Windows and PowerShell 5.1), restricted to exposed calls. The abstract's phrasing does not say Windows; the full text does."
      - "A separate Linux corpus (nine developers, 71 sessions) exists in the paper and is not the source of the 12.0%."
      - "The client version the corpus ran on is not stated in the passages read, so whether current Claude Code releases still change these calls is open."
  - id: MTRX-W41-MODEL-BLAMED
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-intent-execution
    lens_id: runtime-adapter
    mode: extractive
    content: "All 10 measured harnesses changed a call. On 102 production failures labelled by two annotators, sampled within each verdict of the authors' protocol, the labels put 56 on the execution path; Who&When's all-at-once LLM judge, reading each whole trajectory, attributed 97 of the 102 (95.1%) to the LLM, and its step-by-step and binary-search judges flagged the path in 49 and 45 but agreed with the labels at kappa 0.04 and 0.01, against 0.77 for the authors' protocol."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "All 10 measured harnesses change a call. Trajectory-based judgment attributes 95.1% of the production failures to the LLM, although the path caused more than half of them."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "We score the judges and the ablations against a human reference from 2 samples of the production sessions, drawn at random within each verdict of the IEC protocol."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "whereas the all-at-once judge attributes 97 of the 102 failures to the LLM."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "Table 5: Attribution of 102 failures. Attributed to the path, correctly (of 56) / incorrectly (of 46): Who&When all-at-once 0 / 0, kappa 0.00; Who&When step-by-step 29 / 20, kappa 0.04; Who&When binary search 25 / 20, kappa 0.01; IEC protocol (ours) 54 / 1, kappa 0.77"
        ref_type: chunk
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "The abstract's 95.1% is the most model-blaming of three trajectory judges, not trajectory reading in general: the other two attributed about half the failures to the path but picked the wrong ones about as often as the right ones."
      - "'More than half' is 56 of 102 failures in a sample drawn within each of the protocol's verdicts, so it is a share of that sample, not a measured prevalence across the corpus."
      - "Trajectory-based judgment is the attribution method the authors argue against; their own hop-level protocol is the one validated against human labels, so the 95.1% is a measure of what one transcript judge concludes, not of model quality."
  - id: MTRX-W41-PATH-COST
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-intent-execution
    lens_id: runtime-adapter
    mode: extractive
    content: "On the authors' IEC-Bench the changing path raised token cost per passed task 2.4 times (up to 12.3 times); a hop that changes a call hides the changes after it, so 55.1% of the failures on one path appear only after its first hop is repaired; and on the same benchmark IntAct recovers 79.2% of the failures with a changed call (137 of 173 lost pairs), which the authors also deploy in a commercial product."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "On IEC-Bench, the path raises the token cost per passed task 2.4 times (up to 12.3 times)."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "A hop that changes a call also hides the changes after it, so 55.1% of the failures on one path appear only after its first hop is repaired."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.04375"
        quote_or_span: "IntAct, deployed in a commercial product, recovers 79.2% of the failures with a changed call."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "It recovers 79.2% of the IEC-Bench failures with a changed call and lowers the token cost per passed task 2.4 times."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.04375"
        quote_or_span: "With the recorded actions held fixed, 137 of the 173 lost pairs with a changed call pass once IntAct repairs the named hop, so the repair recovers 79.2% of them."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "IEC-Bench is built by the authors from the changes they observed, so the 2.4x cost multiplier is on calls selected to be the kind that change."
      - "The 79.2% is measured on IEC-Bench with the recorded actions held fixed, per the full text; the abstract sets it beside the commercial deployment, but the paper's figure for that deployment is different: 197 of 9,032 replayed native invocations changed before IntAct and none after."
  - id: MTRX-W41-WITNESS-METHOD
