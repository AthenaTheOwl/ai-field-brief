    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed a case where a user-installed mod could make an organization's guard skip its check; such a mod is now unloaded"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed a plugin hook with a `.catch` being unloaded, and its `.catch` skipped, when the hook kept the hooks worker busy on a prompt or tool call"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed tool calls made while the plugin hooks worker restarts being answered without the plugins' permission hooks"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed a mod's hook that called `next(e)` and then failed while the turn was interrupted letting the call through; the call is now rejected"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed a mod's guard hook with a `.catch` being skipped silently for calls another mod's hook makes beneath the guard's own `$` call; its `.catch` is now asked"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed a plugin's `tool.check` hook answering allow running a tool that requires your answer (a question, a plan approval) without showing its dialog"
