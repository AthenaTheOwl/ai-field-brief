cells:
  - id: MTRX-W41-CLEAN-EXIT-FAILURES
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-thinkingbox
    lens_id: eval
    mode: extractive
    content: "In ThinkingBox's common-set ablation of 121,680 valid trials across 12 models, first reported in the authors' paper of 2026-08-20 and restated in the 2026-10-03 Hugging Face post, 79,853 attempts failed the executable state checks, and 67.24% of those failures still terminated cleanly, invoked a state-changing tool and reported no final tool error; the checks found wrong field values in 77.61% of all the failed attempts, unintended extra effects in 43.30% and missing required effects in 25.36%."
    source_refs:
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "In a common-set ablation covering 121,680 valid trials across 12 LLM models, 79,853 attempts failed the executable checks. Of those failures, 67.24% still terminated cleanly, invoked a state-changing tool, and reported no final tool error."
        ref_type: quote
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "Executable checks nevertheless found wrong field values in 77.61% of them, unintended extra effects in 43.30%, and missing required effects in 25.36%."
        ref_type: quote
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "page datePublished 2026-10-03T22:56:48Z; dateline Published October 3, 2026"
        ref_type: timestamp
      - uri: "https://arxiv.org/html/2608.19741v1"
        quote_or_span: "analyzes 79,853 failed trials among 121,680 valid recorded trials over the common task set and 12 models."
        ref_type: quote
      - uri: "https://arxiv.org/html/2608.19741v1"
        quote_or_span: "and 67.24% additionally end without an explicit terminal tool error."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2608.19741"
        quote_or_span: "arXiv [v1] Thu, 20 Aug 2026 07:37:57 UTC; [v4] Thu, 1 Oct 2026 16:14:54 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Out-of-window figure: the ablation is in v1 of the authors' paper, arXiv 2608.19741, submitted 2026-08-20, which 2026-W34 picked; the 2026-10-03 post restates it. It is cited as dated context for the in-window fault-injection result, not as this week's finding."
      - "The 67.24% is a share of failed attempts, not of all attempts, and the three state-check categories overlap, as the page says. The 77.61%, 43.30% and 25.36% are shares of all 79,853 failed attempts, not of the clean-exit subset (61,973 wrong-field-value trials exceed the 53,697 clean exits)."
      - "'No final tool error' means the last tool response carried no explicit error; the paper's failure signatures put most failures under tool usage, which includes explicit tool errors earlier in the trace."
      - "ThinkingBox is the authors' own benchmark of synthetic stateful business workflows in five domains, published jointly by Microsoft and Hugging Face; the model scores were not re-run for this issue."
  - id: MTRX-W41-REPEAT-DEPENDABILITY
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-thinkingbox
    lens_id: eval
    mode: extractive
    content: "Every one of 507 stateful workflows runs 20 times from an identical clean backend. Claude Opus 5.5 beats Claude Opus 5 on the every-attempt average, 67.16% against 66.50%, and passes exactly the same number of tasks on all 20 attempts, 241; GPT-6 Astra keeps 78% of its single-attempt rate across 20 repeats, while GLM-5.1, Kimi-K2.6 and DeepSeek-V4-Pro keep about 8%."
    source_refs:
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "Across 507 stateful business workflows, each run 20 times against various LLM models, it grades agents on terminal backend state and side effects."
        ref_type: quote
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "Claude Opus 5.5 scores higher than Claude Opus 5 on every-attempt average, 67.16% against 66.50%, and solves more tasks at least once. It passes exactly the same number of tasks on all 20 attempts: 241."
        ref_type: quote
      - uri: "https://huggingface.co/blog/microsoft/thinkingbox"
        quote_or_span: "Only three hold on to most of their pass@1 scores: GPT-6 Astra retains 78% of its single-attempt rate, and Claude Opus 5.5 and Claude Opus 5 each retain 71%."
        ref_type: quote
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "Observed 20/20 is a literal count on one benchmark run per model, with no estimator, as the page states; the retention figures come from a chart summarised in the text."
      - "The page says the two Opus versions pass the same number of tasks on all 20 attempts, not the same tasks. The Opus 5.5 comparison is new in the 2026-10-03 post; the paper's latest version (v4, 2026-10-01) does not include Opus 5.5."
      - "Costs on the same page are priced at undiscounted OpenRouter list rates and described by the authors as a comparative index, not an invoice; they are not used in this issue."
  - id: MTRX-W41-QUIET-FAULT-DETECTION
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-loud-quiet-failures
    lens_id: eval
    mode: extractive
    content: "Across 1,920 fault-injected trials (six models from three families, 24 multi-step tasks on one function-calling benchmark), agents treated a failure as a problem in 91.3% of trials when the tool returned an explicit error and in 58.8% when it returned a plausible wrong value, against a 26.8% rate of reporting problems when nothing was wrong. A prompt line asking the agent to check each result, tried on one matched model pair in a 480-trial arm, did not move detection."
    source_refs:
      - uri: "https://arxiv.org/abs/2610.10062"
        quote_or_span: "Agents treat a failure as a problem in 91.3% of trials when the tool returns an explicit error, but in 58.8% of trials when it returns a plausible wrong value, against a 26.8% rate of reporting problems when nothing was wrong."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.10062"
        quote_or_span: "Six models from three families, half of them reasoning variants, ran 1,920 trials over 24 multi-step tasks."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.10062"
        quote_or_span: "A prompt line asking the agent to check each result did not move detection."
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.10062"
        quote_or_span: "One line was added to the system prompt for a matched pair of models, in a second arm of 480 trials"
        ref_type: quote
      - uri: "https://arxiv.org/html/2610.10062"
        quote_or_span: "This arm ran on one family, so it does not license a general claim about metacognitive prompting."
        ref_type: quote
      - uri: "https://arxiv.org/abs/2610.10062"
        quote_or_span: "arXiv [v1] Wed, 7 Oct 2026 13:29:59 UTC"
        ref_type: timestamp
    confidence: medium
    faithfulness_status: passed
    status: verified
    warnings:
      - "One benchmark: the authors wrap the executable environments of one established function-calling benchmark in a fault-injection layer, so the rates are bounded to its 24 tasks."
      - "The 26.8% false-report rate is the baseline the 58.8% has to be read against; the gap between noticing a plausible wrong value and noticing nothing is about 32 points, not 58.8."
      - "Reasoning variants noticed less than their instruct siblings (-9.3 points pooled, p < .001), and the authors say Claude's own difference is not robust to model specification."
      - "The prompt-line result is one model family: the authors say the arm 'does not license a general claim about metacognitive prompting'."
