        ref_type: quote
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Fix notes only, with no count of affected calls; that the harness rewrites calls at all is shown by the 2.1.292 line itself, which repairs misnamed parameters before execution."
  - id: MTRX-W41-BASH-RULE-SPELLINGS
    matrix_run_id: MTRX-W41-clean-exit-failures
    source_item_id: src-w41-claude-code-2-1-289-to-296
    lens_id: security
    mode: abstractive
    content: "Between 2.1.289 (2026-10-03) and 2.1.296 (2026-10-09), ten Claude Code release-note lines fix a Bash deny or ask rule, a Bash permission check or a sandbox exemption pattern that missed a command, approved it unasked or let it out of the sandbox because the checker read it differently from the shell, git or the filesystem: an environment-variable prefix with an expanded value, a bare variable assignment, a declare, typeset, export or readonly prefix, wildcards the shell expands in rg and git grep arguments, variable names zsh reads differently from bash, a short git clone option, a wildcard inside an option value, an 8.3 or alternate Windows spelling of a home folder, an assignment to BASH_ARGV0, and a Git Bash spelling of a Windows user folder."
    source_refs:
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.289"
        quote_or_span: "Fixed Bash deny and ask rules missing a command behind an environment variable prefix with an expanded value (e.g. `TZ=\"$HOME\" rm -rf build`) when the sandbox auto-allows commands"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.289"
        quote_or_span: "Fixed a Bash deny or ask rule being skipped under sandbox auto-allow when a bare variable assignment came before the command"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed a deny or ask rule missing a command or path whose name came from a variable set as a prefix on `declare`, `typeset`, `export` or `readonly`"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed Bash permission checks auto-approving some read-only commands (such as `rg` or `git grep`) whose arguments the shell would still expand as wildcards; these now prompt for approval"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed Bash permission checks auto-approving certain commands whose variable names zsh reads differently from bash; these now prompt for approval"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed a short form of a `git clone` option keeping the sandbox exemption from a git pattern such as `git *` in `sandbox.excludedCommands`; it is now treated like the long form"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.290"
        quote_or_span: "Fixed Bash permission checks not applying Read deny rules or the outside-directory read block to a wildcard in some option values of read-only commands"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.292"
        quote_or_span: "Fixed `rm -rf` on the 8.3 short name or another alternate Windows spelling of the home folder or a drive not being treated as removing it"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.296"
        quote_or_span: "Fixed Bash permission checks auto-approving some commands that assign the `BASH_ARGV0` shell variable and then use it; these now prompt for approval"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.296"
        quote_or_span: "Windows: Fixed `rm -rf /c/Users/<name>` in Git Bash not asking in bypass permissions mode"
        ref_type: quote
      - uri: "https://github.com/anthropics/claude-code/releases/tag/v2.1.289"
        quote_or_span: "release published_at 2026-10-03T23:07:17Z; v2.1.296 published_at 2026-10-09T19:28:59Z"
        ref_type: timestamp
    confidence: high
    faithfulness_status: passed
    status: verified
    warnings:
      - "Ten is the brief's count under a stated criterion: a Bash rule, Bash permission check or sandbox exemption pattern that missed, auto-approved or unsandboxed a command because of how the shell, git or filesystem would read it. A 2.1.295 line fixing permission checks for for-loops over glob patterns is excluded because it does not say which direction the check erred."
      - "The git clone line is not a deny or ask rule: the short option form kept an exemption from the sandbox under a sandbox.excludedCommands pattern, so it is a text pattern widening the OS boundary rather than a rule missing a command."
      - "The release notes carry no severity or advisory, and two of the ten applied only under sandbox auto-allow, where the sandbox still bounded what the command could reach."
